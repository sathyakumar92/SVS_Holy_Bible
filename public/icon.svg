<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8222" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#9C7720" />
    </linearGradient>
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#232630" />
      <stop offset="100%" stop-color="#2E3340" />
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E3340" />
      <stop offset="100%" stop-color="#232630" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" />

  <!-- Radiance Aura behind the Bible -->
  <g opacity="0.25">
    <circle cx="256" cy="240" r="140" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- Rays -->
    <line x1="256" y1="90" x2="256" y2="120" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="360" x2="256" y2="390" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="240" x2="150" y2="240" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="362" y1="240" x2="392" y2="240" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="160" y1="144" x2="182" y2="166" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="330" y1="314" x2="352" y2="336" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="352" y1="144" x2="330" y2="166" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="182" y1="314" x2="160" y2="336" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Open Holy Bible Book -->
  <!-- Left Page Stack Base -->
  <path d="M 256 348 C 220 338, 140 336, 92 352 L 88 178 C 140 162, 220 166, 256 182 Z" fill="#1C1F27" opacity="0.8" />
  <!-- Right Page Stack Base -->
  <path d="M 256 348 C 292 338, 372 336, 420 352 L 424 178 C 372 162, 292 166, 256 182 Z" fill="#1C1F27" opacity="0.8" />

  <!-- Left Main Page -->
  <path d="M 256 340 C 218 326, 140 326, 96 340 L 96 166 C 140 152, 218 152, 256 168 Z" fill="url(#pageGradLeft)" stroke="#3D4454" stroke-width="1.5" />
  <!-- Right Main Page -->
  <path d="M 256 340 C 294 326, 372 326, 416 340 L 416 166 C 372 152, 294 152, 256 168 Z" fill="url(#pageGradRight)" stroke="#3D4454" stroke-width="1.5" />

  <!-- Spine Center Shadow -->
  <path d="M 254 168 L 258 168 L 258 340 L 254 340 Z" fill="#13151B" />

  <!-- Scripture Text Lines Representation (Left Page) -->
  <g opacity="0.35" stroke="url(#goldGrad)" stroke-linecap="round" stroke-width="2.5">
    <line x1="126" y1="200" x2="226" y2="200" />
    <line x1="126" y1="222" x2="226" y2="222" />
    <line x1="126" y1="244" x2="210" y2="244" />
    <line x1="126" y1="266" x2="226" y2="266" />
    <line x1="126" y1="288" x2="190" y2="288" />
    <line x1="126" y1="310" x2="216" y2="310" />
  </g>

  <!-- Scripture Text Lines Representation (Right Page) -->
  <g opacity="0.35" stroke="url(#goldGrad)" stroke-linecap="round" stroke-width="2.5">
    <line x1="286" y1="200" x2="386" y2="200" />
    <line x1="286" y1="222" x2="386" y2="222" />
    <line x1="286" y1="244" x2="360" y2="244" />
    <line x1="286" y1="266" x2="386" y2="266" />
    <line x1="286" y1="288" x2="370" y2="288" />
    <line x1="286" y1="310" x2="340" y2="310" />
  </g>

  <!-- Central Gold Cross Motif -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Beam -->
    <rect x="250" y="196" width="12" height="116" rx="3" fill="url(#goldGrad)" />
    <!-- Horizontal Cross Beam -->
    <rect x="228" y="224" width="56" height="12" rx="3" fill="url(#goldGrad)" />
    <!-- Center Jewel / Highlight -->
    <circle cx="256" cy="230" r="5" fill="#FFFBE6" />
  </g>

  <!-- Gold Bookmark Ribbon Flowing Down -->
  <path d="M 256 340 Q 256 376, 266 406 L 278 412 L 268 392 Q 258 368, 256 340 Z" fill="url(#goldAccent)" opacity="0.9" />

  <!-- Typography at bottom: "SVS BIBLE" -->
  <text x="256" y="458" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    SVS BIBLE
  </text>
</svg>
